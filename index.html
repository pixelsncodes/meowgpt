<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MeowGPT — your most useless AI</title>

<!-- SEO -->
<meta name="description" content="It's ChatGPT, but it's a cat. The world's most useless AI — responds exclusively in meows. Powered by Mochi." />
<meta name="theme-color" content="#fff8f1" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="assets/meowgpt-logo.png" />
<link rel="apple-touch-icon" href="assets/meowgpt-logo.png" />

<!-- Open Graph (Facebook, LinkedIn, iMessage, Slack, Discord, WhatsApp) -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://meowgpt.app/" />
<meta property="og:title" content="MeowGPT — your most useless AI" />
<meta property="og:description" content="It's ChatGPT, but it's a cat. Responds exclusively in meows." />
<meta property="og:image" content="https://meowgpt.app/assets/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="MeowGPT — Mochi the cat at a keyboard" />
<meta property="og:site_name" content="MeowGPT" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:url" content="https://meowgpt.app/" />
<meta name="twitter:title" content="MeowGPT — your most useless AI" />
<meta name="twitter:description" content="It's ChatGPT, but it's a cat. Responds exclusively in meows." />
<meta name="twitter:image" content="https://meowgpt.app/assets/og-image.png" />
<meta name="twitter:image:alt" content="MeowGPT — Mochi the cat at a keyboard" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8f1;
    --bg-2: #fdf3ea;
    --surface: #fff8f1;
    --ink: #4a3528;
    --ink-soft: #9b7d68;
    --ink-hint: #b09680;
    --accent: #f0a07e;
    --accent-soft: #fcd9c4;
    --accent-bg: #fbe4d2;
    --border-c: #f0dcc8;
    --border-strong: #e8d5c0;
    --scroll-thumb: #e8b896;
    --scroll-thumb-hover: #d9a98a;
    --scroll-track: #f7e6d3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    position: relative;
    font-size: 18px;
  }

  /* ===== HEADER ===== */
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border-c);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 3;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 26px;
    color: var(--ink);
    letter-spacing: 0.3px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    background: var(--accent-bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo-mark img { width: 100%; height: 100%; object-fit: contain; }

  .logo-text .gpt {
    background: var(--ink);
    color: var(--surface);
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 18px;
    margin-left: 2px;
  }

  .counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--accent-bg);
    padding: 5px 14px;
    border-radius: 999px;
    transition: background 0.3s, color 0.3s;
  }

  .counter.warn {
    background: var(--accent);
    color: var(--surface);
  }

  /* ===== STICKY CAT HERO ===== */
  .cat-hero {
    background: var(--surface);
    padding: 8px 16px 0;
    text-align: center;
    flex-shrink: 0;
    z-index: 2;
    position: relative;
  }

  .cat-hero::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: 32px;
    background: linear-gradient(to bottom, var(--surface) 0%, rgba(255, 248, 241, 0) 100%);
    pointer-events: none;
    z-index: 3;
  }

  .cat-stage {
    width: 160px;
    height: 160px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cat-stage img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: opacity 0.25s ease;
  }

  /* ===== CHAT AREA ===== */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 24px;
    -webkit-overflow-scrolling: touch;
  }

  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-track { background: var(--scroll-track); border-radius: 999px; margin: 12px 4px; }
  main::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }
  main::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  main { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--scroll-track); }

  .messages {
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Welcome state */
  .welcome {
    text-align: center;
    padding: 0 4px 8px;
  }

  .welcome h1 {
    font-size: 30px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.15;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }

  .welcome h1 em {
    color: var(--accent);
    font-style: italic;
  }

  .welcome p {
    font-size: 16px;
    color: var(--ink-soft);
    font-style: italic;
    max-width: 320px;
    margin: 0 auto 16px;
    line-height: 1.35;
  }

  .suggestions {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 720px;
    margin: 0 auto;
  }

  .suggestion {
    background: var(--surface);
    border: 1px solid var(--border-c);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
    white-space: nowrap;
  }

  .suggestion:hover {
    background: var(--accent-bg);
    border-color: var(--accent-soft);
  }

  .suggestion:active {
    transform: scale(0.98);
  }

  /* Messages */
  .msg {
    display: flex;
    gap: 10px;
    animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    align-items: flex-start;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-user { justify-content: flex-end; }

  .bubble {
    max-width: 75%;
    padding: 12px 18px;
    border-radius: 20px;
    font-size: 19px;
    line-height: 1.35;
    word-wrap: break-word;
    color: var(--ink);
  }

  .msg-user .bubble {
    background: var(--accent-soft);
    border-bottom-right-radius: 6px;
  }

  .msg-bot .bubble {
    background: var(--surface);
    border: 1px solid var(--border-c);
    border-bottom-left-radius: 6px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent-bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .avatar img { width: 100%; height: 100%; object-fit: contain; }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 5px;
    padding: 4px 0;
    align-items: center;
  }

  .typing span {
    width: 9px;
    height: 9px;
    background: var(--ink-soft);
    border-radius: 50%;
    animation: typing 1.4s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ===== INPUT AREA ===== */
  .input-area {
    padding: 12px 16px 10px;
    background: var(--surface);
    border-top: 1px solid var(--border-c);
    flex-shrink: 0;
    z-index: 2;
  }

  .input-wrap {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .input-box {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border-c);
    border-radius: 999px;
    padding: 4px 6px 4px 18px;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 48px;
    transition: border-color 0.15s;
  }

  .input-box:focus-within {
    border-color: var(--accent);
  }

  textarea {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 18px;
    color: var(--ink);
    resize: none;
    padding: 10px 0;
    line-height: 1.3;
    max-height: 110px;
    min-height: 24px;
  }

  textarea::placeholder { color: var(--ink-hint); font-style: italic; }

  .icon-btn {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s, background 0.15s;
  }

  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { width: 18px; height: 18px; }

  .send-btn { background: var(--accent); }
  .send-btn:hover { background: #ea8b65; }
  .send-btn svg { color: var(--surface); }

  .mic-btn {
    width: 42px;
    height: 42px;
    background: var(--accent-bg);
    color: var(--ink-soft);
  }
  .mic-btn:hover { background: var(--accent-soft); }

  .disclaimer {
    text-align: center;
    font-size: 13px;
    color: var(--ink-hint);
    margin-top: 8px;
    font-style: italic;
  }

  .credit {
    text-align: center;
    font-size: 14px;
    color: var(--ink-hint);
    margin-top: 2px;
  }

  .credit a {
    color: var(--accent);
    text-decoration: none;
    transition: color 0.15s;
  }

  .credit a:hover {
    color: var(--ink);
  }

  /* ===== VOICE MODE OVERLAY ===== */
  .voice-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .voice-overlay.active { display: flex; }

  .blob-container {
    width: min(280px, 70vw);
    height: min(280px, 70vw);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .blob {
    width: 100%;
    height: 100%;
    background: var(--accent-soft);
    border-radius: 50%;
    overflow: hidden;
    animation: blobBreathe 2s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .blob img { width: 100%; height: 100%; object-fit: contain; }

  @keyframes blobBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .wave {
    position: absolute;
    border: 2px solid var(--accent);
    border-radius: 50%;
    opacity: 0;
    animation: wave 2s infinite ease-out;
  }

  .wave:nth-child(1) { animation-delay: 0s; }
  .wave:nth-child(2) { animation-delay: 0.5s; }
  .wave:nth-child(3) { animation-delay: 1s; }

  @keyframes wave {
    0% { width: 100%; height: 100%; opacity: 0.5; }
    100% { width: 160%; height: 160%; opacity: 0; }
  }

  .voice-status {
    margin-top: 40px;
    font-size: 22px;
    font-style: italic;
    color: var(--ink-soft);
    min-height: 30px;
    text-align: center;
  }

  .voice-status strong {
    color: var(--ink);
    font-style: normal;
  }

  .waveform {
    display: flex;
    gap: 4px;
    align-items: center;
    height: 40px;
    margin-top: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .waveform.active { opacity: 1; }

  .wave-bar {
    width: 4px;
    background: var(--accent);
    border-radius: 2px;
    animation: waveform 0.8s infinite ease-in-out;
  }

  @keyframes waveform {
    0%, 100% { height: 8px; }
    50% { height: 32px; }
  }

  .voice-close {
    margin-top: 36px;
    background: var(--ink);
    color: var(--surface);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    font-family: inherit;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .voice-close:active { transform: scale(0.96); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--surface);
    padding: 12px 22px;
    border-radius: 999px;
    font-style: italic;
    font-size: 16px;
    z-index: 50;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 480px) {
    header { padding: 10px 14px; }
    .logo { font-size: 22px; }
    .logo-mark { width: 36px; height: 36px; }
    .logo-text .gpt { font-size: 15px; }
    .cat-hero { padding: 8px 14px 0; }
    .cat-stage { width: 120px; height: 120px; }
    main { padding: 4px 14px 18px; }
    .welcome h1 { font-size: 26px; }
    .welcome p { font-size: 15px; }
    .suggestion { font-size: 14px; padding: 6px 12px; }
    .bubble { font-size: 17px; padding: 11px 16px; }
    .avatar { width: 36px; height: 36px; }
    .input-area { padding: 10px 12px 8px; }
    textarea { font-size: 16px; }
    .disclaimer { font-size: 12px; }
  }

  @media (min-width: 1024px) {
    header { padding: 14px 28px; }
    .logo { font-size: 30px; }
    .logo-mark { width: 46px; height: 46px; }
    .logo-text .gpt { font-size: 21px; padding: 3px 10px; border-radius: 10px; }
    .counter { font-size: 14px; padding: 6px 16px; }
    .cat-hero { padding: 14px 16px 0; }
    .cat-stage { width: 230px; height: 230px; }
    main { padding: 8px 24px 28px; }
    .welcome { padding: 0 4px 20px; }
    .welcome h1 { font-size: 38px; margin-bottom: 10px; }
    .welcome p { font-size: 18px; max-width: 400px; margin-bottom: 30px; }
    .suggestions { max-width: 780px; gap: 10px; }
    .suggestion { font-size: 16px; padding: 8px 18px; }
    .bubble { font-size: 21px; padding: 14px 22px; max-width: 70%; }
    .avatar { width: 48px; height: 48px; }
    .messages { max-width: 820px; gap: 18px; }
    .input-area { padding: 16px 24px 14px; }
    .input-wrap { max-width: 820px; gap: 12px; }
    .input-box { padding: 4px 8px 4px 22px; min-height: 56px; }
    textarea { font-size: 20px; padding: 14px 0; }
    .icon-btn { width: 44px; height: 44px; }
    .send-btn svg, .mic-btn svg { width: 20px; height: 20px; }
    .mic-btn { width: 48px; height: 48px; }
    .disclaimer { font-size: 14px; margin-top: 10px; }
  }

  @media (min-width: 1600px) {
    .logo { font-size: 32px; }
    .logo-mark { width: 52px; height: 52px; }
    .logo-text .gpt { font-size: 23px; }
    .counter { font-size: 16px; padding: 7px 18px; }
    .cat-stage { width: 190px; height: 190px; }
    .cat-hero { padding: 16px 16px 0; }
    .welcome h1 { font-size: 44px; }
    .welcome p { font-size: 21px; max-width: 460px; }
    .suggestions { max-width: 820px; }
    .suggestion { font-size: 17px; padding: 9px 20px; }
    .bubble { font-size: 23px; padding: 16px 26px; }
    .avatar { width: 56px; height: 56px; }
    .messages { max-width: 920px; gap: 22px; }
    .input-wrap { max-width: 920px; }
    .input-box { min-height: 62px; }
    textarea { font-size: 22px; padding: 16px 0; }
    .icon-btn { width: 48px; height: 48px; }
    .mic-btn { width: 52px; height: 52px; }
    .disclaimer { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <img src="assets/meowgpt-logo.png" alt="MeowGPT logo" />
    </div>
    <span class="logo-text">Meow<span class="gpt">GPT</span></span>
  </div>
  <div class="counter" id="counter">0 / 50</div>
</header>

<div class="cat-hero">
  <div class="cat-stage">
    <img id="cat-img" src="assets/meow-cat-neutral.png" alt="MeowGPT cat" />
  </div>
</div>

<main id="chat">
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h1>Ask me <em>anything.</em></h1>
      <p>I respond exclusively in meows. It's my one talent. 🐾</p>
      <div class="suggestions">
        <button class="suggestion" data-q="What's the meaning of life?">What's the meaning of life?</button>
        <button class="suggestion" data-q="How do I get rich?">How do I get rich?</button>
        <button class="suggestion" data-q="Are you sentient?">Are you sentient?</button>
        <button class="suggestion" data-q="Tell me a secret">Tell me a secret</button>
      </div>
    </div>
  </div>
</main>

<div class="input-area">
  <div class="input-wrap">
    <div class="input-box">
      <textarea id="input" placeholder="Ask MeowGPT anything..." rows="1"></textarea>
      <button class="icon-btn send-btn" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
    <button class="icon-btn mic-btn" id="mic" aria-label="Voice mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
      </svg>
    </button>
  </div>
  <p class="disclaimer">🐾 MeowGPT can make mistakes. Verify all meows independently.</p>
  <p class="credit">Developed by <a href="https://kaziahmed.net" target="_blank" rel="noopener">Kazi Ahmed</a></p>
</div>

<div class="voice-overlay" id="voice-overlay">
  <div class="blob-container">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="blob">
      <img src="assets/meow-cat-cute.gif" alt="Listening cat" />
    </div>
  </div>
  <div class="voice-status" id="voice-status"><em>Listening...</em></div>
  <div class="waveform" id="waveform">
    <div class="wave-bar" style="animation-delay: 0s"></div>
    <div class="wave-bar" style="animation-delay: 0.1s"></div>
    <div class="wave-bar" style="animation-delay: 0.2s"></div>
    <div class="wave-bar" style="animation-delay: 0.15s"></div>
    <div class="wave-bar" style="animation-delay: 0.3s"></div>
    <div class="wave-bar" style="animation-delay: 0.05s"></div>
    <div class="wave-bar" style="animation-delay: 0.25s"></div>
    <div class="wave-bar" style="animation-delay: 0.4s"></div>
    <div class="wave-bar" style="animation-delay: 0.1s"></div>
    <div class="wave-bar" style="animation-delay: 0.35s"></div>
  </div>
  <button class="voice-close" id="voice-close">Tap to stop</button>
</div>

<div class="toast" id="toast">Conversation reset — that's a lot of meows 🐾</div>

<script>
  const MEOW_VARIANTS = [
    "meow", "meow meow", "mrrrow", "purrr", "mew", "MEOW", "meow?", "meow!",
    "mrow mrow", "*purrs*", "meeeow", "nya", "mraow", "prrrp", "meow meow meow",
    "*tail flick* meow", "...meow", "MEOWWW", "mrrp?", "purr purr"
  ];

  const CAT_NEUTRAL = "assets/meow-cat-neutral.png";
  const CAT_BOO = "assets/meow-cat-boo.gif";
  const CAT_CUTE = "assets/meow-cat-cute.gif";
  const CAT_HI = "assets/meow-cat-hi.gif";
  const CAT_TYPING = "assets/meow-cat-typing.gif";
  // Weighted idle pool — neutral/boo/cute appear ~3x more often than hi
  const IDLE_POOL = [
    CAT_NEUTRAL, CAT_NEUTRAL, CAT_NEUTRAL,
    CAT_BOO, CAT_BOO, CAT_BOO,
    CAT_CUTE, CAT_CUTE, CAT_CUTE,
    CAT_HI
  ];

  const catImg = document.getElementById('cat-img');
  let idleTimer = null;
  let currentCat = CAT_NEUTRAL;
  let isTyping = false;

  function pickIdleCat() {
    let next;
    do {
      next = IDLE_POOL[Math.floor(Math.random() * IDLE_POOL.length)];
    } while (next === currentCat && IDLE_POOL.length > 1);
    return next;
  }

  function scheduleIdleSwap() {
    clearTimeout(idleTimer);
    const delay = 3500 + Math.random() * 3500;
    idleTimer = setTimeout(() => {
      if (!isTyping) {
        currentCat = pickIdleCat();
        catImg.src = currentCat;
        scheduleIdleSwap();
      }
    }, delay);
  }

  function setCatTyping() {
    isTyping = true;
    clearTimeout(idleTimer);
    currentCat = CAT_TYPING;
    catImg.src = CAT_TYPING;
  }

  function setCatIdle() {
    isTyping = false;
    currentCat = CAT_NEUTRAL;
    catImg.src = CAT_NEUTRAL;
    scheduleIdleSwap();
  }

  // Audio — synthesized Web Audio meow (works reliably across all browsers)
  let audioCtx = null;
  function playMeow() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      const duration = 0.4 + Math.random() * 0.3;
      const now = ctx.currentTime;
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      osc1.type = 'sawtooth'; osc2.type = 'sine';
      filter.type = 'lowpass'; filter.Q.value = 8;
      const startFreq = 600 + Math.random() * 200;
      const peakFreq = startFreq * 1.4;
      const endFreq = startFreq * 0.7;
      osc1.frequency.setValueAtTime(startFreq, now);
      osc1.frequency.linearRampToValueAtTime(peakFreq, now + duration * 0.3);
      osc1.frequency.linearRampToValueAtTime(endFreq, now + duration);
      osc2.frequency.setValueAtTime(startFreq * 2, now);
      osc2.frequency.linearRampToValueAtTime(peakFreq * 2, now + duration * 0.3);
      osc2.frequency.linearRampToValueAtTime(endFreq * 2, now + duration);
      filter.frequency.setValueAtTime(800, now);
      filter.frequency.linearRampToValueAtTime(2000, now + duration * 0.3);
      filter.frequency.linearRampToValueAtTime(600, now + duration);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
      gain.gain.setValueAtTime(0.15, now + duration * 0.7);
      gain.gain.linearRampToValueAtTime(0, now + duration);
      osc1.connect(filter); osc2.connect(filter);
      filter.connect(gain); gain.connect(ctx.destination);
      osc1.start(now); osc2.start(now);
      osc1.stop(now + duration); osc2.stop(now + duration);
    } catch (e) { console.log('audio unavailable'); }
  }

  const messagesEl = document.getElementById('messages');
  const welcomeEl = document.getElementById('welcome');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const micBtn = document.getElementById('mic');
  const counterEl = document.getElementById('counter');
  const voiceOverlay = document.getElementById('voice-overlay');
  const voiceStatus = document.getElementById('voice-status');
  const voiceClose = document.getElementById('voice-close');
  const waveform = document.getElementById('waveform');
  const toast = document.getElementById('toast');

  const MAX_MESSAGES = 50;
  let messageCount = 0;
  let voiceTimeout = null;
  let voiceStage = 'idle';

  function getRandomMeow() {
    return MEOW_VARIANTS[Math.floor(Math.random() * MEOW_VARIANTS.length)];
  }

  function updateCounter() {
    counterEl.textContent = `${messageCount} / ${MAX_MESSAGES}`;
    if (messageCount >= MAX_MESSAGES * 0.8) {
      counterEl.classList.add('warn');
    } else {
      counterEl.classList.remove('warn');
    }
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  }

  function resetChat() {
    messagesEl.innerHTML = '';
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = 'block';
    messageCount = 0;
    updateCounter();
    setCatIdle();
    showToast("Conversation reset — that's a lot of meows 🐾");
  }

  function addMessage(text, isUser) {
    if (welcomeEl.style.display !== 'none') {
      welcomeEl.style.display = 'none';
    }
    const msg = document.createElement('div');
    msg.className = 'msg ' + (isUser ? 'msg-user' : 'msg-bot');
    if (!isUser) {
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = `<img src="assets/meowgpt-logo.png" alt="cat" />`;
      msg.appendChild(avatar);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg msg-bot';
    msg.id = 'typing-msg';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = `<img src="assets/meowgpt-logo.png" alt="cat" />`;
    msg.appendChild(avatar);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing-msg');
    if (t) t.remove();
  }

  function scrollToBottom() {
    const main = document.getElementById('chat');
    setTimeout(() => { main.scrollTop = main.scrollHeight; }, 50);
  }

  function sendMessage(text) {
    text = text.trim();
    if (!text) return;
    if (messageCount >= MAX_MESSAGES) { resetChat(); return; }

    addMessage(text, true);
    messageCount++;
    updateCounter();
    inputEl.value = '';
    autoGrow();

    const delay = 600 + Math.random() * 900;
    setTimeout(() => {
      setCatTyping();
      addTyping();
      const replyDelay = 700 + Math.random() * 600;
      setTimeout(() => {
        removeTyping();
        addMessage(getRandomMeow(), false);
        messageCount++;
        updateCounter();
        setCatIdle();

        if (messageCount >= MAX_MESSAGES) {
          setCatTyping();
          setTimeout(() => {
            addMessage("(...okay that's enough meows. resetting...)", false);
            setTimeout(resetChat, 1800);
          }, 800);
        }
      }, replyDelay);
    }, delay);
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
  }

  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });
  sendBtn.addEventListener('click', () => sendMessage(inputEl.value));

  document.querySelectorAll('.suggestion').forEach(btn => {
    btn.addEventListener('click', () => sendMessage(btn.dataset.q));
  });

  // Voice mode
  function startVoiceMode() {
    voiceOverlay.classList.add('active');
    voiceStage = 'listening';
    voiceStatus.innerHTML = '<em>Listening...</em>';
    waveform.classList.add('active');
    const listenDuration = 2500 + Math.random() * 2500;
    voiceTimeout = setTimeout(() => {
      voiceStage = 'transcribing';
      voiceStatus.innerHTML = '<em>Thinking...</em>';
      waveform.classList.remove('active');
      voiceTimeout = setTimeout(() => {
        voiceStage = 'replying';
        voiceStatus.innerHTML = '<strong>"meow"</strong>';
        playMeow();
        voiceTimeout = setTimeout(() => {
          if (messageCount < MAX_MESSAGES - 1) {
            addMessage("🎤 (voice message)", true);
            addMessage(getRandomMeow(), false);
            messageCount += 2;
            updateCounter();
          }
          stopVoiceMode();
        }, 800);
      }, 700 + Math.random() * 400);
    }, listenDuration);
  }

  function stopVoiceMode() {
    if (voiceTimeout) { clearTimeout(voiceTimeout); voiceTimeout = null; }
    voiceOverlay.classList.remove('active');
    waveform.classList.remove('active');
    voiceStage = 'idle';
    voiceStatus.innerHTML = '<em>Listening...</em>';
  }

  micBtn.addEventListener('click', startVoiceMode);
  voiceClose.addEventListener('click', () => {
    if (voiceStage === 'listening') {
      clearTimeout(voiceTimeout);
      voiceStage = 'transcribing';
      voiceStatus.innerHTML = '<em>Thinking...</em>';
      waveform.classList.remove('active');
      voiceTimeout = setTimeout(() => {
        voiceStage = 'replying';
        voiceStatus.innerHTML = '<strong>"meow"</strong>';
        playMeow();
        voiceTimeout = setTimeout(() => {
          if (messageCount < MAX_MESSAGES - 1) {
            addMessage("🎤 (voice message)", true);
            addMessage(getRandomMeow(), false);
            messageCount += 2;
            updateCounter();
          }
          stopVoiceMode();
        }, 800);
      }, 500);
    } else {
      stopVoiceMode();
    }
  });

  // Init — Mochi waves hi on first load
  updateCounter();
  catImg.src = CAT_HI;
  currentCat = CAT_HI;
  scheduleIdleSwap();
</script>

</body>
</html>
