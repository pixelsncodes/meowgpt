<meta charset="utf-8">
<!-- ===================================================================
     MeowSushi — a cute cat-sushi-cafe game
     Single self-contained file. Vanilla HTML/CSS/JS only.
     Drop this whole file into a Squarespace Code Block.
     Everything is scoped under .ms-* so it won't touch your page.
     ==================================================================== -->

<div class="ms-stage">
  <!-- .ms-game is the 9:16 frame. container-type:size lets every child
       size itself in cqmin units (1cqmin = 1% of the square's side),
       so the whole UI scales perfectly on any screen with no scrollbars. -->
  <div class="ms-game" id="ms-game">
    <div class="ms-loader" id="ms-loader">
      <div class="ms-loader-inner">
        <div class="ms-loader-emoji">🍣</div>
        <div class="ms-loader-label">Preparing your sushi…</div>
        <div class="ms-loader-track">
          <div class="ms-loader-bar" id="ms-loader-bar"></div>
        </div>
      </div>
    </div>
    <div class="ms-inner">

      <!-- ---------- CUSTOMER AREA (recipe card + cat) ---------- -->
      <section class="ms-customer">
        <div class="ms-score-coin"><span class="ms-score-value" id="ms-score">0</span></div>

        <!-- LEFT: recipe / order card -->
        <div class="ms-recipe" id="ms-recipe">
          <div class="ms-recipe-art" id="ms-recipe-art">🍣</div>
          <div class="ms-recipe-name" id="ms-recipe-name">Sushi</div>
          <div class="ms-recipe-needs" id="ms-recipe-needs"></div>
        </div>

        <!-- RIGHT: peeking kawaii cat -->
        <div class="ms-cat" id="ms-cat">
          <div class="ms-cat-bubble" id="ms-cat-bubble">Meow!</div>
          <div class="ms-cat-face" id="ms-cat-face">🐱</div>
        </div>
      </section>

      <!-- ---------- BOTTOM WORKSPACE ---------- -->
      <div class="ms-workspace">

        <!-- ---------- PREP AREA (slots get built by JS) ---------- -->
        <section class="ms-prep" id="ms-prep"></section>

        <!-- ---------- INGREDIENT GRID 3x2 (built by JS) ---------- -->
        <section class="ms-grid" id="ms-grid"></section>

        <!-- ---------- BOTTOM BUTTONS ---------- -->
        <footer class="ms-actions">
          <button class="ms-btn ms-btn-clear" id="ms-clear" type="button">clear</button>
          <button class="ms-btn ms-btn-serve" id="ms-serve" type="button">serve</button>
        </footer>

      </div>

    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

/* =====================================================================
   GLOBAL BACKGROUND
   ===================================================================== */
html, body {
  background: #3E0A0A;
  margin: 0;
  padding: 0;
}

/* =====================================================================
   THEME TOKENS  — tweak the whole look from here
   ===================================================================== */
.ms-stage{
  /* Lacquer palette (from the brief) */
  --lacquer:#a70000;        /* deep lacquer red (box body)        */
  --red-bright:#d92c2c;     /* inner red                          */
  --red-deep:#b41f1f;       /* inner red (darker)                 */
  --red-glow:#f45a42;       /* warm highlight red                 */
  --outline:#5a0909;        /* dark outlines                      */
  --outline-soft:#7a1414;   /* softer outline                     */

  /* Buttons */
  --coral:#ff8c7a;          /* Clear button                       */
  --coral-deep:#e85f4d;
  --mint:#8fe3b6;           /* Serve button                       */
  --mint-deep:#54c98a;

  /* Neutral cream used inside compartments / cards */
  --cream:#fff3e6;
  --cream-deep:#ffe3c7;
  --ink:#4a0a0a;            /* warm dark text                     */

  /* Geometry */
  --r-box:4cqmin;           /* outer box radius                   */
  --r-comp:4.5cqmin;        /* compartment radius                 */
  --gap:2cqmin;             /* base gap between sections          */

  /* Layout helpers */
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  padding:2vmin;
  box-sizing:border-box;
  background:#3E0A0A;
  font-family:"Fredoka", system-ui, sans-serif;
  -webkit-tap-highlight-color:transparent;
  text-transform:lowercase;
}
.ms-stage *{ box-sizing:border-box; margin:0; padding:0; }

/* ---------------------------------------------------------------------
   THE FRAME.  width tracks its container but is capped by viewport
   height so it always stays a visible 9:16 frame with no scrolling.
   --------------------------------------------------------------------- */
.ms-game{
  width:min(100%, calc(92svh * 9 / 16));
  aspect-ratio:9 / 16;
  container-type:size;           /* enables cqmin units inside */
  border-radius:var(--r-box);
  background:var(--lacquer);
  border:1.4cqmin solid var(--outline);
  box-shadow:0 2cqmin 5cqmin rgba(90,9,9,.35);
  overflow:hidden;               /* hard guarantee: nothing escapes */
  position:relative;
}
/* soft glossy lacquer highlight sweeping across the top */
.ms-game::before{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 28%);
  pointer-events:none;
  border-radius:inherit;
}

.ms-inner{
  position:relative;
  width:100%; height:100%;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0;
}

/* =====================================================================
   BOTTOM WORKSPACE  (flat bento panel behind prep / grid / buttons)
   ===================================================================== */
.ms-workspace{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:2cqmin;
  padding:2cqmin;
  background:#C23B2D;
  border-radius:0;
}

/* Reusable "concave molded compartment" look (top section = convex/cushion) */
.ms-compartment{
  background:radial-gradient(120% 120% at 50% 35%, var(--cream) 0%, var(--cream-deep) 100%);
  border:.7cqmin solid var(--outline);
  box-shadow:
    inset 0 1.4cqmin 2cqmin rgba(255,255,255,.85),
    inset 0 -1.6cqmin 2.4cqmin rgba(120,40,20,.28);
}

/* =====================================================================
   SCORE COIN
   ===================================================================== */
.ms-score-coin{
  position:absolute;
  top:3cqmin; right:3cqmin;
  width:14cqmin; height:14cqmin;
  border-radius:50%;
  background:#FFD23F;
  border:.7cqmin solid var(--outline);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:4;
}
.ms-score-value{
  font-size:6cqmin;
  font-weight:900;
  color:var(--ink);
  text-shadow:none;
  transition:transform .18s ease;
}
.ms-score-value.ms-pop{ transform:scale(1.35); }

/* =====================================================================
   CUSTOMER AREA  (scene)
   ===================================================================== */
.ms-customer{
  flex:0 0 auto;
  width:100%;
  aspect-ratio:6 / 5;
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg, #bfeaff 0%, #dff7ff 62%, #fff2e8 100%);
  border-radius:0;
  border:none;
  box-shadow:none;
}
/* ---- Recipe / order card ---- */
.ms-recipe{
  position:absolute;
  top:6cqmin; left:5cqmin;
  width:44cqmin;
  z-index:3;
  padding:2cqmin;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
  background:rgba(255, 255, 255, 0.15);
  border:1px solid rgba(255, 255, 255, 1);
  border-radius:16px;
  box-shadow:0 4px 30px rgba(0, 0, 0, 0.1);
  backdrop-filter:blur(6.1px);
  -webkit-backdrop-filter:blur(6.1px);
  isolation:isolate;
}
.ms-recipe::before,
.ms-recipe::after{
  content:"";
  position:absolute;
  pointer-events:none;
}
.ms-recipe::before{
  right:-2.1cqmin;
  bottom:8.9cqmin;
  width:5cqmin;
  height:5cqmin;
  background:rgba(255, 255, 255, 0.15);
  border-top:1px solid rgba(255, 255, 255, 1);
  border-right:1px solid rgba(255, 255, 255, 1);
  border-radius:0 8px 0 0;
  transform:rotate(45deg);
  z-index:-1;
  box-shadow:4px -4px 18px rgba(0, 0, 0, 0.06);
  backdrop-filter:blur(6.1px);
  -webkit-backdrop-filter:blur(6.1px);
}
.ms-recipe::after{
  right:-1px;
  bottom:8.2cqmin;
  width:2px;
  height:6.6cqmin;
  background:rgba(255, 255, 255, 0.15);
  backdrop-filter:blur(6.1px);
  -webkit-backdrop-filter:blur(6.1px);
}
.ms-recipe-art{
  font-size:26cqmin;
  line-height:1;
  margin-bottom:-2cqmin;
}
.ms-recipe-art img{ width:44cqmin; height:44cqmin; object-fit:contain; }
.ms-recipe-name{
  font-size:4.2cqmin;
  font-weight:900;
  color:var(--ink);
  text-align:center;
  line-height:1.05;
}
.ms-recipe-needs{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:1cqmin;
  font-size:5cqmin;
  line-height:1;
}
.ms-recipe-needs span{
  filter:drop-shadow(0 .3cqmin .3cqmin rgba(0,0,0,.15));
}
.ms-recipe-needs img{ width:5.2cqmin; height:5.2cqmin; object-fit:contain; }

/* ---- Cat (peeks bottom-right of scene) ---- */
.ms-cat{
  position:absolute;
  right:-12cqmin; bottom:0;
  width:86cqmin; height:86cqmin;
  background:none;
  border:none;
  box-shadow:none;
  border-radius:0;
  overflow:visible;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:2;
}
.ms-cat-face{
  font-size:40cqmin;
  line-height:1;
  /* pushed down so only the top "half body" peeks in */
  transform:translateY(14%);
  will-change:transform;
  transition:opacity .18s ease, transform .25s ease;
  animation:ms-bob 2.4s ease-in-out infinite;
}
.ms-cat-face img{ width:68cqmin; height:auto; transform:translateY(8%); }
.ms-cat-bubble{
  display:block;
  position:absolute;
  top:28cqmin; left:50%;
  z-index:2;
  transform:translateX(-50%) scale(0);
  opacity:0;
  background:#fff;
  color:var(--ink);
  font-weight:800;
  font-size:3.4cqmin;
  padding:1cqmin 2.4cqmin;
  border-radius:3cqmin;
  border:.5cqmin solid var(--outline);
  box-shadow:0 .6cqmin 1cqmin rgba(0,0,0,.2);
  white-space:nowrap;
  pointer-events:none;
}
/* reaction animations */
.ms-cat.is-happy .ms-cat-face{ animation:ms-happy .5s ease; }
.ms-cat.is-sad   .ms-cat-face{ animation:ms-shake .45s ease; }

@keyframes ms-bob{ 0%,100%{transform:translateY(14%);} 50%{transform:translateY(9%);} }
@keyframes ms-happy{
  0%{transform:translateY(14%) scale(1);}
  35%{transform:translateY(2%) scale(1.12);}
  100%{transform:translateY(14%) scale(1);}
}
@keyframes ms-shake{
  0%,100%{transform:translateY(14%) rotate(0);}
  20%{transform:translateY(14%) rotate(-7deg);}
  40%{transform:translateY(14%) rotate(7deg);}
  60%{transform:translateY(14%) rotate(-5deg);}
  80%{transform:translateY(14%) rotate(5deg);}
}

/* =====================================================================
   PREP AREA  (slot row)
   ===================================================================== */
.ms-prep{
  flex:0 0 auto;
  flex-shrink:0;
  height:15cqmin;
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:1fr;
  gap:1.6cqmin;
}
.ms-slot{
  position:relative;
  border-radius:3.5cqmin;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#A22C22;
  border:.6cqmin solid #7E1C14;
  box-shadow:inset 0 1.4cqmin 0 rgba(90,9,9,0.35), inset 0 -1cqmin 0 rgba(255,160,140,0.12);
}
.ms-slot .ms-slot-emoji{
  font-size:8cqmin; line-height:1;
  animation:ms-plop .25s ease;
}
.ms-slot .ms-slot-emoji img{ width:12cqmin; height:12cqmin; object-fit:contain; }
.ms-slot.is-empty{ opacity:.5; }
.ms-slot.is-empty::after{
  content:"";
  width:5cqmin; height:5cqmin;
  border-radius:50%;
  border:.6cqmin dashed rgba(255,255,255,.45);
}
/* remove (X) button on a filled slot */
.ms-slot-x{
  position:absolute;
  top:-1.4cqmin; right:-1.4cqmin;
  width:5.2cqmin; height:5.2cqmin;
  border-radius:50%;
  border:.5cqmin solid var(--outline);
  background:#ffffff;
  color:var(--outline);
  font-size:3.4cqmin;
  font-weight:900;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 .5cqmin .8cqmin rgba(0,0,0,.3);
  transition:transform .12s ease;
}
.ms-slot-x:active{ transform:scale(.85); }
@keyframes ms-plop{ 0%{transform:scale(.3);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }

/* =====================================================================
   INGREDIENT GRID  (3 cols x 2 rows)
   ===================================================================== */
.ms-grid{
  flex:0 0 auto;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,auto);
  gap:1.8cqmin;
}
.ms-ing{
  position:relative;
  aspect-ratio:1 / 1;
  min-height:0;
  border-radius:3.5cqmin;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:1.4cqmin;
  cursor:pointer;
  color:#fff7f0;
  font-weight:800;
  font-size:3.3cqmin;
  background:#A22C22;
  border:.7cqmin solid #7E1C14;
  box-shadow:inset 0 1.4cqmin 0 rgba(90,9,9,0.35), inset 0 -1cqmin 0 rgba(255,160,140,0.12);
  transition:transform .1s ease, opacity .15s ease;
  user-select:none;
}
.ms-ing-emoji{ font-size:6cqmin; line-height:1; }
.ms-ing-emoji img{ width:24cqmin; height:24cqmin; object-fit:contain; }
@media (hover:hover){ .ms-ing:hover{ filter:brightness(1.08); } }
.ms-ing:active{ transform:scale(.93); }
/* already-used ingredient */
.ms-ing.is-used{
  outline:.8cqmin solid #ffffff;
  opacity:.55;
  cursor:default;
  pointer-events:none;
}
.ms-ing.is-used::after{
  content:"✓";
  position:absolute; top:1cqmin; right:1.6cqmin;
  font-size:4cqmin; color:#bfffce;
  text-shadow:0 0 1cqmin rgba(0,0,0,.5);
}

/* =====================================================================
   BOTTOM BUTTONS
   ===================================================================== */
.ms-actions{
  flex:0 0 auto;
  flex-shrink:0;
  height:11cqmin;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2cqmin;
}
.ms-btn{
  border:none;
  border-radius:3.5cqmin;
  font-size:4.6cqmin;
  font-weight:900;
  letter-spacing:0;
  cursor:pointer;
  color:#fff;
  transition:transform .1s ease, filter .15s ease;
  text-shadow:none;
}
.ms-btn:active{ transform:translateY(.8cqmin) scale(.98); }
@media (hover:hover){ .ms-btn:hover{ filter:brightness(1.06); } }
.ms-btn-clear{
  background:#EFA088;
  border:.6cqmin solid #D98668;
  color:#3A1610;
}
.ms-btn-serve{
  background:#95D29C;
  border:.6cqmin solid #5FB079;
  color:#16432A;
}

/* When the whole game reacts to a serve */
.ms-game.is-correct{ animation:ms-bounce .4s ease; }
.ms-game.is-wrong{ animation:ms-nudge .35s ease; }
@keyframes ms-bounce{ 0%,100%{transform:scale(1);} 40%{transform:scale(1.02);} }
@keyframes ms-nudge{ 0%,100%{transform:translateX(0);}
  25%{transform:translateX(-1.5cqmin);} 75%{transform:translateX(1.5cqmin);} }

/* respect reduced-motion */
@media (prefers-reduced-motion:reduce){
  .ms-cat-face{ animation:none !important; }
}

.ms-loader{
  position:absolute;
  inset:0;
  z-index:100;
  background:var(--lacquer);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:inherit;
  transition:opacity .4s ease;
}
.ms-loader.is-done{
  opacity:0;
  pointer-events:none;
}
.ms-loader-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3cqmin;
}
.ms-loader-emoji{
  font-size:16cqmin;
  animation:ms-bob 1.5s ease-in-out infinite;
}
.ms-loader-label{
  font-size:4.5cqmin;
  font-weight:700;
  color:#fff3e6;
}
.ms-loader-track{
  width:60cqmin;
  height:4cqmin;
  background:rgba(0,0,0,.3);
  border-radius:2cqmin;
  overflow:hidden;
  border:.4cqmin solid var(--outline-soft);
}
.ms-loader-bar{
  height:100%;
  width:0%;
  background:#FFD23F;
  border-radius:2cqmin;
  transition:width .25s ease;
}

/* Cat slide in/out */
@keyframes ms-cat-enter{
  from{ transform:translateX(110cqmin); }
  to  { transform:translateX(0); }
}
@keyframes ms-cat-leave{
  from{ transform:translateX(0); }
  to  { transform:translateX(110cqmin); }
}
.ms-cat.is-hidden  { transform:translateX(110cqmin); }
.ms-cat.is-entering{ animation:ms-cat-enter .45s cubic-bezier(.25,.46,.45,.94) forwards; }
.ms-cat.is-leaving { animation:ms-cat-leave .4s  cubic-bezier(.55,.055,.675,.19) forwards; }

/* Cat bubble pop in/out */
@keyframes ms-bubble-in{
  from{ transform:translateX(-50%) scale(0); opacity:0; }
  65% { transform:translateX(-50%) scale(1.12); opacity:1; }
  to  { transform:translateX(-50%) scale(1); opacity:1; }
}
@keyframes ms-bubble-out{
  from{ transform:translateX(-50%) scale(1); opacity:1; }
  to  { transform:translateX(-50%) scale(0); opacity:0; }
}
.ms-cat-bubble.is-showing{ opacity:1; animation:ms-bubble-in  .25s ease forwards; }
.ms-cat-bubble.is-hiding { animation:ms-bubble-out .2s  ease forwards; }

/* Recipe card pop in/out */
@keyframes ms-recipe-in{
  from{ transform:scale(.55); opacity:0; }
  70% { transform:scale(1.06); opacity:1; }
  to  { transform:scale(1);    opacity:1; }
}
@keyframes ms-recipe-out{
  from{ transform:scale(1);   opacity:1; }
  to  { transform:scale(.55); opacity:0; }
}
.ms-recipe.is-hidden { opacity:0; pointer-events:none; transform:scale(.55); }
.ms-recipe.is-showing{ animation:ms-recipe-in  .3s ease forwards; }
.ms-recipe.is-hiding { animation:ms-recipe-out .2s ease forwards; }
</style>

<script>
(function () {
  "use strict";

  /* ===================================================================
     ASSET SYSTEM
     Drop transparent PNG URLs in here later and they auto-replace the
     emoji. Leave a value empty ("") to use the emoji fallback.
     =================================================================== */
  const ASSETS = {
    cats: {            // by state: neutral / happy / sad
      neutral: "/sushi/assets/cat_ordering.png",
      happy:   "/sushi/assets/cat_happy.png",
      sad:     "/sushi/assets/cat_sad.png"
    },
    recipeCards: {     // keyed by recipe id
      salmon_sashimi:    "/sushi/assets/sushi_salmon_sashimi.png",
      tuna_sashimi:      "/sushi/assets/sushi_tuna_sashimi.png",
      salmon_nigiri:     "/sushi/assets/sushi_salmon_nigiri.png",
      tuna_nigiri:       "/sushi/assets/sushi_tuna_nigiri.png",
      salmon_roll:       "/sushi/assets/sushi_salmon_roll.png",
      tuna_avocado_roll: "/sushi/assets/sushi_tuna_avocado_roll.png",
      veggie_roll:       "/sushi/assets/sushi_veggie_roll.png",
      rainbow_roll:      "/sushi/assets/sushi_rainbow_roll.png"
    },
    ingredients: {     // keyed by ingredient id (grid buttons)
      salmon:   "/sushi/assets/ing_salmon.png",
      tuna:     "/sushi/assets/ing_tuna.png",
      rice:     "/sushi/assets/ing_rice.png",
      nori:     "/sushi/assets/ing_nori.png",
      avocado:  "/sushi/assets/ing_avocado.png",
      cucumber: "/sushi/assets/ing_cucumber.png"
    },
    preparedIngredients: { // keyed by ingredient id (shown in prep slots)
      salmon:   "/sushi/assets/ing_salmon.png",
      tuna:     "/sushi/assets/ing_tuna.png",
      rice:     "/sushi/assets/ing_rice.png",
      nori:     "/sushi/assets/ing_nori.png",
      avocado:  "/sushi/assets/ing_avocado.png",
      cucumber: "/sushi/assets/ing_cucumber.png"
    }
  };

  /* ===================================================================
     DATA
     =================================================================== */
  const INGREDIENTS = [
    { id: "salmon",   name: "Salmon",   emoji: "🐟" },
    { id: "tuna",     name: "Tuna",     emoji: "🐠" },
    { id: "rice",     name: "Rice",     emoji: "🍚" },
    { id: "nori",     name: "Nori",     emoji: "🌿" },
    { id: "avocado",  name: "Avocado",  emoji: "🥑" },
    { id: "cucumber", name: "Cucumber", emoji: "🥒" }
  ];
  // quick id -> ingredient lookup
  const ING = Object.fromEntries(INGREDIENTS.map(i => [i.id, i]));

  const RECIPES = [
    { id: "salmon_sashimi",   name: "Salmon Sashimi",   emoji: "🐟", ingredients: ["salmon"] },
    { id: "tuna_sashimi",     name: "Tuna Sashimi",     emoji: "🐠", ingredients: ["tuna"] },
    { id: "salmon_nigiri",    name: "Salmon Nigiri",    emoji: "🍣", ingredients: ["salmon","rice"] },
    { id: "tuna_nigiri",      name: "Tuna Nigiri",      emoji: "🍣", ingredients: ["tuna","rice"] },
    { id: "salmon_roll",      name: "Salmon Roll",      emoji: "🍣", ingredients: ["rice","nori","salmon"] },
    { id: "tuna_avocado_roll",name: "Tuna Avocado Roll",emoji: "🍣", ingredients: ["rice","nori","tuna","avocado"] },
    { id: "veggie_roll",      name: "Veggie Roll",      emoji: "🥬", ingredients: ["rice","nori","avocado","cucumber"] },
    { id: "rainbow_roll",     name: "Rainbow Roll",     emoji: "🌈", ingredients: ["rice","nori","salmon","tuna","avocado"] }
  ];

  /* ===================================================================
     CONFIG  (easy to tweak)
     NOTE: Rainbow Roll needs 5 ingredients, so MAX_PREP_SLOTS defaults
     to 5 to keep every recipe winnable. Set it to 4 if you trim/remove
     the 5-ingredient recipe.
     =================================================================== */
  const CONFIG = {
    MAX_PREP_SLOTS: 5,
    POINTS_CORRECT: 5,
    POINTS_WRONG:   1,
    NEXT_ROUND_MS:  1500
  };

  const CAT_SOUNDS = {
    neutral: ["Meow~", "Mrrp!", "Purr...", "Nyaa!", "Mrow?", "Prrrr~"],
    happy:   ["Purrrr! ♥", "Nyaa~ ♥", "Mrrp! ♥", "Meow! ♥", "Purrfect! ♥"],
    sad:     ["Mrrp...", "Meow...", "Nyaaa...", "Mrow...", "Prrr..."]
  };

  /* ===================================================================
     STATE
     =================================================================== */
  let state = {
    score: 0,
    order: null,     // current recipe
    prep: [],        // array of ingredient ids
    locked: false    // true while showing a reaction
  };

  /* ===================================================================
     DOM REFS
     =================================================================== */
  const el = {
    game:       document.getElementById("ms-game"),
    score:      document.getElementById("ms-score"),
    recipe:     document.getElementById("ms-recipe"),
    recipeArt:  document.getElementById("ms-recipe-art"),
    recipeName: document.getElementById("ms-recipe-name"),
    recipeNeeds:document.getElementById("ms-recipe-needs"),
    cat:        document.getElementById("ms-cat"),
    catFace:    document.getElementById("ms-cat-face"),
    catBubble:  document.getElementById("ms-cat-bubble"),
    prep:       document.getElementById("ms-prep"),
    grid:       document.getElementById("ms-grid"),
    clear:      document.getElementById("ms-clear"),
    serve:      document.getElementById("ms-serve")
  };

  /* ===================================================================
     HELPERS
     =================================================================== */
  // Return an <img> tag if a PNG asset exists, else the emoji fallback.
  function visual(assetUrl, emoji, altText) {
    return assetUrl
      ? `<img src="${assetUrl}" alt="${altText || ""}" draggable="false">`
      : emoji;
  }
  const rand  = arr => arr[Math.floor(Math.random() * arr.length)];
  const setsEqual = (a, b) =>
    a.length === b.length && a.every(x => b.includes(x));

  /* ===================================================================
     RENDERERS
     =================================================================== */
  function renderScore() { el.score.textContent = state.score; }

  function renderOrder() {
    const r = state.order;
    el.recipeArt.innerHTML  = visual(ASSETS.recipeCards[r.id], r.emoji, r.name);
    el.recipeName.textContent = r.name;
    // show the icons of the ingredients the cat wants
    el.recipeNeeds.innerHTML = r.ingredients.map(id => {
      const ing = ING[id];
      return `<span title="${ing.name}">${visual(ASSETS.ingredients[id], ing.emoji, ing.name)}</span>`;
    }).join("");
  }

  function renderPrep() {
    let html = "";
    for (let i = 0; i < CONFIG.MAX_PREP_SLOTS; i++) {
      const id = state.prep[i];
      if (id) {
        const ing = ING[id];
        html += `<div class="ms-slot" data-index="${i}">
                   <button class="ms-slot-x" data-remove="${id}" type="button" aria-label="Remove ${ing.name}">×</button>
                   <span class="ms-slot-emoji">${visual(ASSETS.preparedIngredients[id], ing.emoji, ing.name)}</span>
                 </div>`;
      } else {
        html += `<div class="ms-slot is-empty"></div>`;
      }
    }
    el.prep.innerHTML = html;
  }

  // Grid is built once; we just toggle the "is-used" state afterward.
  function buildGrid() {
    el.grid.innerHTML = INGREDIENTS.map(ing =>
      `<button class="ms-ing" data-add="${ing.id}" type="button">
         <span class="ms-ing-emoji">${visual(ASSETS.ingredients[ing.id], ing.emoji, ing.name)}</span>
       </button>`
    ).join("");
  }

  function refreshGridState() {
    el.grid.querySelectorAll(".ms-ing").forEach(btn => {
      const id = btn.dataset.add;
      btn.classList.toggle("is-used", state.prep.includes(id));
    });
  }

  function setCat(stateName) {
    const map = { neutral: "🐱", happy: "😸", sad: "😿" };
    el.catFace.innerHTML = visual(ASSETS.cats[stateName], map[stateName], stateName + " cat");
    el.cat.classList.remove("is-happy", "is-sad");
    if (stateName === "happy") el.cat.classList.add("is-happy");
    if (stateName === "sad")   el.cat.classList.add("is-sad");
  }

  /* ===================================================================
     ANIMATION HELPERS
     =================================================================== */
  function showBubble(type) {
    el.catBubble.textContent = rand(CAT_SOUNDS[type]);
    el.catBubble.classList.remove("is-hiding");
    el.catBubble.classList.add("is-showing");
  }

  function hideBubble(callback) {
    el.catBubble.classList.remove("is-showing");
    el.catBubble.classList.add("is-hiding");
    setTimeout(() => {
      el.catBubble.classList.remove("is-hiding");
      if (callback) callback();
    }, 200);
  }

  function showRecipe(callback) {
    el.recipe.classList.remove("is-hidden", "is-hiding");
    el.recipe.classList.add("is-showing");
    setTimeout(() => {
      el.recipe.classList.remove("is-showing");
      if (callback) callback();
    }, 300);
  }

  function hideRecipe(callback) {
    el.recipe.classList.remove("is-showing");
    el.recipe.classList.add("is-hiding");
    setTimeout(() => {
      el.recipe.classList.remove("is-hiding");
      el.recipe.classList.add("is-hidden");
      if (callback) callback();
    }, 200);
  }

  /* ===================================================================
     GAME ACTIONS
     =================================================================== */
  function addIngredient(id) {
    if (state.locked) return;
    if (state.prep.includes(id)) return;            // only once
    if (state.prep.length >= CONFIG.MAX_PREP_SLOTS) return;
    state.prep.push(id);
    renderPrep();
    refreshGridState();
  }

  function removeIngredient(id) {
    if (state.locked) return;
    state.prep = state.prep.filter(x => x !== id);
    renderPrep();
    refreshGridState();
  }

  function clearPrep() {
    if (state.locked) return;
    state.prep = [];
    renderPrep();
    refreshGridState();
  }

  function serve() {
    if (state.locked) return;
    state.locked = true;

    const correct = setsEqual(state.prep, state.order.ingredients);
    const gained  = correct ? CONFIG.POINTS_CORRECT : CONFIG.POINTS_WRONG;

    state.score += gained;
    renderScore();

    // Score coin pop
    el.score.classList.add("ms-pop");
    setTimeout(() => el.score.classList.remove("ms-pop"), 200);

    // Screen flash
    el.game.classList.add(correct ? "is-correct" : "is-wrong");
    setTimeout(() => el.game.classList.remove("is-correct", "is-wrong"), 450);

    // 1. Hide order card
    hideRecipe(() => {

      // 2. Cat reacts with bubble
      const mood = correct ? "happy" : "sad";
      setCat(mood);
      showBubble(mood);

      // 3. After 2s, hide bubble and slide cat out
      setTimeout(() => {
        hideBubble(() => {
          el.cat.classList.remove("is-entering");
          el.cat.classList.add("is-leaving");

          // 4. After slide-out, call nextRound (it handles the 500ms pause)
          setTimeout(() => {
            el.cat.classList.remove("is-leaving");
            el.cat.classList.add("is-hidden");
            nextRound();
          }, 400);
        });
      }, 2000);
    });
  }

  function nextRound() {
    // avoid repeating the same order twice in a row when possible
    let next = rand(RECIPES);
    if (RECIPES.length > 1) {
      while (state.order && next.id === state.order.id) next = rand(RECIPES);
    }
    state.order  = next;
    state.prep   = [];
    state.locked = true;   // stays locked throughout the intro sequence

    renderPrep();
    refreshGridState();
    renderOrder();         // update recipe content while card is still hidden

    // Reset cat to off-screen
    el.cat.classList.remove("is-entering", "is-leaving");
    el.cat.classList.add("is-hidden");

    // 500ms pause, then slide cat in
    setTimeout(() => {
      setCat("neutral");
      el.cat.classList.remove("is-hidden");
      el.cat.classList.add("is-entering");

      // Slide-in completes -> greeting bubble
      setTimeout(() => {
        el.cat.classList.remove("is-entering");
        showBubble("neutral");

        // Hold bubble 800ms -> hide -> reveal recipe card -> unlock
        setTimeout(() => {
          hideBubble(() => {
            showRecipe(() => {
              state.locked = false;
            });
          });
        }, 800);
      }, 450);
    }, 500);
  }

  /* ===================================================================
     EVENTS (delegated)
     =================================================================== */
  el.grid.addEventListener("click", e => {
    const btn = e.target.closest("[data-add]");
    if (btn) addIngredient(btn.dataset.add);
  });

  el.prep.addEventListener("click", e => {
    const x = e.target.closest("[data-remove]");
    if (x) removeIngredient(x.dataset.remove);
  });

  el.clear.addEventListener("click", clearPrep);
  el.serve.addEventListener("click", serve);

  /* ===================================================================
     INIT
     =================================================================== */
  function init() {
    buildGrid();
    renderScore();
    el.cat.classList.add("is-hidden");
    el.recipe.classList.add("is-hidden");
    nextRound();
  }

  function preloadAssets(onComplete) {
    const urls = [
      ...Object.values(ASSETS.cats),
      ...Object.values(ASSETS.recipeCards),
      ...Object.values(ASSETS.ingredients),
      ...Object.values(ASSETS.preparedIngredients)
    ].filter(Boolean);

    // ingredients and preparedIngredients share the same URLs — deduplicate
    const unique = [...new Set(urls)];

    if (unique.length === 0) { onComplete(); return; }

    const bar     = document.getElementById("ms-loader-bar");
    const loader  = document.getElementById("ms-loader");
    let loaded    = 0;

    // Minimum display time so the loader never flashes too briefly
    const minWait = new Promise(res => setTimeout(res, 500));

    function onLoad() {
      loaded++;
      if (bar) bar.style.width = (loaded / unique.length * 100) + "%";
      if (loaded >= unique.length) {
        // Wait for both: all assets ready AND at least 500ms elapsed
        minWait.then(() => {
          loader.classList.add("is-done");
          loader.addEventListener("transitionend",
            () => loader.remove(), { once: true });
          onComplete();
        });
      }
    }

    unique.forEach(url => {
      const img   = new Image();
      img.onload  = onLoad;
      img.onerror = onLoad; // count failures too so the game never hangs
      img.src     = url;
    });
  }

  preloadAssets(init);
})();
</script>
